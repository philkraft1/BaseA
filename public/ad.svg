<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082f3a"/>
      <stop offset="52%" stop-color="#0b1214"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="280" fill="url(#glow)"/>
  <ellipse cx="980" cy="560" rx="360" ry="90" fill="#a5f3fc" fill-opacity="0.08"/>

  <g transform="translate(72, 56)">
    <rect width="72" height="72" rx="20" fill="#0e7490"/>
    <rect x="18" y="20" width="36" height="34" rx="6" fill="#ffffff"/>
    <path d="M25 20V16.5M47 20V16.5" stroke="#155e75" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="25" y="29" width="9" height="7" rx="1.4" fill="#06b6d4"/>
    <rect x="38" y="29" width="9" height="7" rx="1.4" fill="#a5f3fc"/>
    <rect x="25" y="40" width="22" height="5" rx="1.4" fill="#0e7490"/>
    <text x="88" y="36" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">Due</text>
    <text x="88" y="62" fill="#a5f3fc" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500">USDC on Base</text>
  </g>

  <text x="72" y="220" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.6">What's due, paid.</text>
  <text x="72" y="278" fill="#cffafe" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500">Standing USDC between people - plus an inbox for who can still spend your dollars.</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(72, 340)">
      <rect width="540" height="88" rx="18" fill="#082f3a" fill-opacity="0.55" stroke="#155e75"/>
      <text x="24" y="36" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="1.4">PURPOSE</text>
      <text x="24" y="64" fill="#ecfeff" font-size="18" font-weight="600">Pay a person, on a schedule or once, in USDC.</text>
    </g>
    <g transform="translate(632, 340)">
      <rect width="576" height="88" rx="18" fill="#082f3a" fill-opacity="0.55" stroke="#155e75"/>
      <text x="24" y="36" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="1.4">FOR</text>
      <text x="24" y="64" fill="#ecfeff" font-size="18" font-weight="600">Rent, allowance, invoices - not swaps or minting.</text>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#ecfeff">
    <rect x="72" y="456" width="268" height="46" rx="23" fill="#155e75"/>
    <text x="206" y="485" text-anchor="middle">Standing orders</text>
    <rect x="352" y="456" width="200" height="46" rx="23" fill="#155e75"/>
    <text x="452" y="485" text-anchor="middle">Pay links</text>
    <rect x="564" y="456" width="236" height="46" rx="23" fill="#155e75"/>
    <text x="682" y="485" text-anchor="middle">Spender inbox</text>
    <rect x="812" y="456" width="260" height="46" rx="23" fill="#155e75"/>
    <text x="942" y="485" text-anchor="middle">Revoke in one tap</text>
  </g>

  <text x="72" y="560" fill="#a5f3fc" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20">Exact-amount USDC. Share a link. You stay in control.</text>
  <text x="72" y="640" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">Open Due - basea-tau.vercel.app</text>
  <text x="980" y="640" fill="#67e8f9" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" text-anchor="end">Built on Base</text>
</svg>
